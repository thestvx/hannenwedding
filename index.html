<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#443333" />
    <link rel="icon" type="image/svg+xml" href="./assets/svg/ornament-favicon.svg" />
    <link rel="stylesheet" href="./fonts.css" />
    <link
      rel="preload"
      href="./fonts/janna-2-thin.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link
      rel="preload"
      href="./fonts/Bettrisia Script Alt Regular.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <title>هناء و إسماعيل — 15 أكتوبر 2026</title>
    <meta
      name="description"
      content="دعوة لحضور حفل زفاف هناء وإسماعيل، 15 أكتوبر 2026، صالة عزوز للافراح والمناسبات."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:title" content="هناء و إسماعيل — 15 أكتوبر 2026" />
    <meta
      property="og:description"
      content="دعوة لحضور حفل زفاف هناء وإسماعيل، 15 أكتوبر 2026، صالة عزوز للافراح والمناسبات."
    />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>

    <!-- The invitation is rendered by React, so without JavaScript there is
         nothing in #root. Rather than leave a blank background03 page, state
         the essential details as static markup. -->
    <noscript>
      <div class="nojs">
        <div class="nojs__card">
          <p class="nojs__names">هناء و إسماعيل</p>
          <p class="nojs__line">15 . 10 . 2026</p>
          <p class="nojs__line">صالة عزوز للافراح والمناسبات</p>
          <p class="nojs__note">يمنع اصطحاب الأطفال &middot; ممنوع التصوير لطفلياً</p>
        </div>
      </div>
      <style>
        .nojs {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          padding: 2rem;
          background: #2a1f1f url('./background/background03.png') center / cover no-repeat;
          font-family: 'Janna 2 Thin', 'Segoe UI', system-ui, sans-serif;
        }
        .nojs__card {
          max-width: 34rem;
          text-align: center;
          color: #f3e6d8;
          text-shadow: 0 1px 3px rgba(20, 12, 12, 0.9);
        }
        .nojs__names {
          margin: 0 0 1.5rem;
          font-size: clamp(2rem, 9vw, 3.5rem);
          font-weight: 700;
        }
        .nojs__line {
          margin: 0.4rem 0;
          font-size: clamp(1rem, 4vw, 1.4rem);
        }
        .nojs__note {
          margin: 2rem 0 0;
          font-size: 0.95rem;
          opacity: 0.85;
        }
      </style>
    </noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
