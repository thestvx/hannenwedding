  <!-- Wax seal face: base, depth, embossed rings, sheen -->
  <symbol id="sealArt" viewBox="0 0 100 100">
    <use href="#waxBlob" fill="url(#waxBase)"/>
    <g clip-path="url(#waxClip)">
      <use href="#waxBlob" fill="url(#waxDepth)"/>
      <ellipse cx="36" cy="31" rx="19" ry="12" fill="url(#waxSheen)" transform="rotate(-30 36 31)"/>

          <circle cx="43" cy="52" r="15.6"/>

<!-- Screen-reader announcements for the opening sequence -->
<p class="sr-only" role="status" aria-live="polite" id="live"></p>

<!-- ============================================================
     STAGE 1 — the sealed envelope
     ============================================================ -->
<div class="envelope-scene" id="envelopeScene">
  <div class="envelope-scene__bg" aria-hidden="true"></div>
  <div class="envelope-scene__aura" aria-hidden="true"></div>
  <div class="envelope-scene__grain" aria-hidden="true"></div>
  <div class="envelope-scene__veil" aria-hidden="true"></div>

  <div class="envelope-scene__inner">
    <div class="envelope-stage" id="envelopeStage">

      <div class="envelope" id="envelope">
        <div class="envelope__back" aria-hidden="true"></div>
        <div class="envelope__throat" aria-hidden="true"></div>

        <div class="envelope__card" aria-hidden="true">
          <div class="envelope__card-face">
            <span class="mini-orn" aria-hidden="true"></span>
            <span class="mini-names" lang="en" dir="ltr">Hanene <i>&amp;</i> Smail</span>
            <span class="mini-date" lang="en" dir="ltr">15 October 2026</span>
            <span class="mini-venue" lang="ar">صالة عزوز للافراح والمناسبات</span>
          </div>
        </div>

        <div class="envelope__front" aria-hidden="true">
          <span class="env-panel env-panel--l"></span>
          <span class="env-panel env-panel--r"></span>
          <span class="env-panel env-panel--b"></span>
          <span class="env-frame"></span>
          <span class="env-sheen"></span>
        </div>

        <div class="envelope__flap" aria-hidden="true">
          <span class="envelope__flap-outer"><span class="flap-orn"><i></i></span></span>
          <span class="envelope__flap-inner"></span>
        </div>

        <div class="envelope-dust" aria-hidden="true"><i></i><i></i><i></i></div>

        <button class="seal" id="seal" type="button" aria-label="افتح دعوة الزفاف" aria-describedby="hint">
          <span class="seal__half seal__half--l" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#sealArt"/></svg></span>
          <span class="seal__half seal__half--r" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#sealArt"/></svg></span>
          <span class="seal__gloss" aria-hidden="true"></span>
          <span class="seal__pulse" aria-hidden="true"></span>
        </button>
      </div>

    </div>

    <p class="hint" id="hint">اضغط على الختم</p>
  </div>
</div>

<!-- ============================================================
     STAGE 2 — the revealed invitation
     ============================================================ -->
<main class="invitation" id="invitation" aria-label="دعوة الزفاف">
  <div class="invitation__backdrop" aria-hidden="true">
    <span class="invitation__ambient"></span>
    <span class="invitation__plate"></span>
  </div>
  <div class="invitation__scrim" aria-hidden="true"></div>
  <div class="invitation__grain" aria-hidden="true"></div>
  <div class="invitation__vignette" aria-hidden="true"></div>

  <div class="motes" aria-hidden="true">
    <i style="--x:12%;--d:0s;--s:.9"></i>
    <i style="--x:26%;--d:-3.4s;--s:.7"></i>
    <i style="--x:63%;--d:-6.8s;--s:1"></i>
    <i style="--x:78%;--d:-2.1s;--s:.8"></i>
    <i style="--x:88%;--d:-5.2s;--s:.65"></i>
    <i style="--x:44%;--d:-7.9s;--s:.75"></i>
  </div>

  <div class="sprigs" aria-hidden="true">
    <svg class="sprig sprig--r" viewBox="0 0 60 210"><use href="#sprig"/></svg>
    <svg class="sprig sprig--l" viewBox="0 0 60 210"><use href="#sprig"/></svg>
  </div>

  <div class="invitation__inner">
    <p class="names" lang="en" dir="ltr">
      <span class="names__part">Hanene</span>
      <span class="names__amp" aria-hidden="true">&amp;</span>
      <span class="names__part">Smail</span>
    </p>

    <span class="rule" aria-hidden="true">
      <i class="rule__line"></i><i class="rule__mark"></i><i class="rule__line"></i>
    </span>

    <p class="date" lang="en" dir="ltr"><time datetime="2026-10-15">15 October 2026</time></p>

    <p class="venue" lang="ar">صالة عزوز للافراح والمناسبات</p>

    <div class="notes">
      <span class="notes__hair" aria-hidden="true"></span>
      <p class="notes__line" lang="ar">يمنع اصطحاب الأطفال</p>
      <p class="notes__line" lang="ar">ممنوع التصوير لطفلياً</p>
    </div>
  </div>
</main>

<noscript>
  <style>
    .envelope-scene { display: none !important; }
    .invitation { opacity: 1 !important; visibility: visible !important; }
    .invitation__backdrop { opacity: 1 !important; transform: none !important; }
    .invitation__inner > * { opacity: 1 !important; transform: none !important; }
    .sprig { opacity: .5 !important; }
  </style>
</noscript>
