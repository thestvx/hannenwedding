<!DOCTYPE html>
<html lang="ar" dir="rtl" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hanene &amp; Smail — 15 October 2026</title>
<meta name="description" content="Hanene &amp; Smail — 15 October 2026 — صالة عزوز للافراح والمناسبات">
<meta name="theme-color" content="#ece2d9">
<meta name="color-scheme" content="light">

<meta property="og:type" content="website">
<meta property="og:title" content="Hanene &amp; Smail — 15 October 2026">
<meta property="og:description" content="صالة عزوز للافراح والمناسبات">

<script>document.documentElement.className = "js";</script>

<link rel="icon" href="assets/svg/ornament-favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/Bettrisia Script Alt Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="fonts/janna-2-thin.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =============================================================
     THE CANVAS
     background02.png, used exactly as supplied. No overlay, no
     scrim, no vignette, no tint, no blur, no filter of any kind.
     It is fixed so the long sheet scrolls over it like paper
     moving beneath glass. The body colour is the image's own
     dominant tone and exists only so overscroll does not flash
     white -- it sits behind the image, never over it.
     ============================================================= -->
<div class="canvas" aria-hidden="true"></div>

<!-- =============================================================
     THE INVITATION
     One continuous column, not a stack of sections. There is no
     card, no border, no panel, no background of its own: the
     rhythm is made purely of whitespace, so the whole thing reads
     as a single tall printed card.
     ============================================================= -->
<main class="invitation" id="invitation">
  <article class="sheet">

    <!-- Crown ornament -->
    <div class="orn orn--crown" data-reveal>
      <svg viewBox="0 0 120 210" aria-hidden="true" focusable="false"><use href="#spray"/></svg>
    </div>

    <!-- The names: the loudest thing on the card, and nothing else competes -->
    <h1 class="names" data-reveal>
      <span class="names__line" lang="en" dir="ltr">Hanene</span>
      <span class="names__amp" lang="en" dir="ltr">&amp;</span>
      <span class="names__line" lang="en" dir="ltr">Smail</span>
    </h1>

    <div class="rule rule--broad" data-reveal aria-hidden="true">
      <i class="rule__line"></i><i class="rule__mark"></i><i class="rule__line"></i>
    </div>

    <p class="date" data-reveal>
      <time datetime="2026-10-15" lang="en" dir="ltr">15 October 2026</time>
    </p>

    <p class="venue" data-reveal>
      <span lang="ar">صالة عزوز للافراح والمناسبات</span>
    </p>

    <div class="rule rule--fine" data-reveal aria-hidden="true">
      <i class="rule__line"></i><i class="rule__mark"></i><i class="rule__line"></i>
    </div>

    <!-- The practical notes, held to the quiet end of the hierarchy -->
    <div class="notes" data-reveal>
      <p class="notes__line" lang="ar">يمنع اصطحاب الأطفال</p>
      <p class="notes__line" lang="ar">ممنوع التصوير لطفلياً</p>
    </div>

    <!-- Foot ornament, mirroring the crown -->
    <div class="orn orn--foot" data-reveal>
      <svg viewBox="0 0 120 210" aria-hidden="true" focusable="false"><use href="#spray"/></svg>
    </div>

  </article>
</main>

<!-- =============================================================
     ORNAMENT
     Drawn once, reused. currentColor carries the tone so the
     ornaments follow the palette rather than baking a colour in.
     ============================================================= -->
<svg class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <symbol id="spray" viewBox="0 0 120 210">
      <g fill="none" stroke="currentColor" stroke-width="1.15"
         stroke-linecap="round" stroke-linejoin="round">
        <!-- stem -->
        <path d="M60 206 C60 150 60 84 60 30"/>
        <!-- leaf pairs, largest at the base -->
        <path d="M60 168 C42 160 30 144 27 124 C45 130 57 148 60 168 Z"/>
        <path d="M60 168 C78 160 90 144 93 124 C75 130 63 148 60 168 Z"/>
        <path d="M60 132 C44 124 34 108 32 90 C47 96 57 114 60 132 Z"/>
        <path d="M60 132 C76 124 86 108 88 90 C73 96 63 114 60 132 Z"/>
        <path d="M60 98 C48 90 41 76 40 60 C52 66 58 82 60 98 Z"/>
        <path d="M60 98 C72 90 79 76 80 60 C68 66 62 82 60 98 Z"/>
        <!-- bud -->
        <path d="M60 30 C53 22 53 11 60 5 C67 11 67 22 60 30 Z"/>
        <circle cx="60" cy="30" r="2.4" fill="currentColor" stroke="none"/>
      </g>
    </symbol>
  </defs>
</svg>

<script src="script.js" defer></script>
</body>
</html>
